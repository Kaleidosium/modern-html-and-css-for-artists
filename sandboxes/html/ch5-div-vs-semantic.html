<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>div vs Semantic Elements - construct.css Demo</title>
  <link rel="stylesheet" href="../construct.css/modern-normalize.css">
  <link rel="stylesheet" href="../construct.css/construct.css">
  <link rel="stylesheet" href="../construct.css/construct.boxes.css">
  <style>
    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      padding: 1rem;
    }

    .column-label {
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: bold;
      margin-block-end: 1rem;
      padding: 0.5rem;
      text-align: center;
      border-radius: 0.25rem;
    }

    .bad-label {
      background: #fee;
      color: #c0392b;
    }

    .good-label {
      background: #efe;
      color: #27ae60;
    }
  </style>
</head>

<body>
  <!-- Left: div soup -->
  <div>
    <div class="bad-label column-label">Only &lt;div&gt;s</div>
    <div>
      <div>Jane Doe</div>
      <div>
        <div>Work</div>
        <div>About</div>
        <div>Contact</div>
      </div>
    </div>
    <div>
      <div>
        <div>Selected Works</div>
        <div>
          <div>Harbor Study No. 3</div>
          <div>Oil on panel, 2025</div>
        </div>
      </div>
    </div>
    <div>
      <div>&copy; 2025 Jane Doe</div>
    </div>
  </div>

  <!-- Right: semantic HTML -->
  <div role="region" aria-label="Semantic example">
    <div class="good-label column-label">Semantic HTML</div>
    <header>
      <h1>Jane Doe</h1>
      <nav aria-label="Primary">
        <a href="/work">Work</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Selected Works</h2>
        <article>
          <h3>Harbor Study No. 3</h3>
          <p>Oil on panel, 2025</p>
        </article>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Jane Doe</p>
    </footer>
  </div>
</body>

</html>
